services:
  postgres:
    image: postgres:16
    container_name: pet-social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pet_social_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: pet-social-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    entrypoint: [
      "migrate",
      "-path=/migrations",
      "-database=postgres://postgres:postgres@postgres:5432/pet_social_platform?sslmode=disable"
    ]

volumes:
  postgres_data:
  minio_data:
