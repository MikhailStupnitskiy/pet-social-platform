services:
  postgres:
    image: postgres:16
    container_name: pet-social-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: pet_social_platform
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate
    profiles: ["tools"]
    volumes:
      - ./backend/migrations:/migrations
    entrypoint: [
      "migrate",
      "-path=/migrations",
      "-database=postgres://postgres:postgres@postgres:5432/pet_social_platform?sslmode=disable"
    ]

volumes:
  postgres_data: